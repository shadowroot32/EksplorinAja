name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cendekia
      JWT_SECRET: ci-only-test-secret-that-is-at-least-thirty-two-characters
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: ci-build-placeholder
      LLM_MODEL: gpt-4o-mini
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run OTP helper tests
        run: npm test
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Build production application
        run: npm run build
